services:
  translator-batch:
    build:
      context: .
    image: ufal/atrium-translator:latest
    volumes:
      - ./data:/data
      - ./config.txt:/app/config.txt:ro
    # Default ENTRYPOINT runs the batch CLI if invoked without a profile
  api:
    build:
      context: .
    image: ufal/atrium-translator:latest
    # Override the ENTRYPOINT to launch the FastAPI service instead
    entrypoint: ["uvicorn", "service.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    # Issue #55 container contract. The skill branch's Dockerfile is single-stage —
    # the API is this service's entrypoint override, not a build target — so the
    # healthcheck and stop signal live here rather than in the Dockerfile, where they
    # would also attach to the batch container that serves nothing. Mirrors the
    # `api` stage on the default branch; `service/healthcheck.py` is the same
    # hub-canonical probe, which had been shipping on this branch unreferenced.
    stop_signal: SIGTERM
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "/app/service/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
    volumes:
      - ./data:/data
      - ./config.txt:/app/config.txt:ro
    profiles: ["api"]
  translator:
    image: ghcr.io/ufal/atrium-translator:${ATRIUM_VERSION:-dev}
    build:
      context: .
      args:
        ATRIUM_RUNNER_IMAGE: ghcr.io/ufal/atrium-translator:${ATRIUM_VERSION:-dev}
        ATRIUM_RUNNER_REPO: https://github.com/ufal/atrium-translator
        ATRIUM_RUNNER_REF: ${ATRIUM_RUNNER_REF:-dev}
    environment:
      ATRIUM_RUNNER_IMAGE: ghcr.io/ufal/atrium-translator:${ATRIUM_VERSION:-dev}
      ATRIUM_RUNNER_REPO: https://github.com/ufal/atrium-translator
      ATRIUM_RUNNER_REF: ${ATRIUM_RUNNER_REF:-dev}
      HF_HOME: /cache/huggingface
    volumes:
      - ./data:/data
      - hf-cache:/cache/huggingface
      - ./config.txt:/app/config.txt:ro
volumes:
  hf-cache:

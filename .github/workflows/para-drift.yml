name: Paradata Canonical Drift
on:
  push:
    branches: [test, master]
  pull_request:
    branches: [test, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  check-drift:
    uses: ufal/atrium-project/.github/workflows/para-drift.reusable.yml@5c25d32e7a5e872213f21dc64aeae86491d603b6  # v1
    with:
      hub-ref: 5c25d32e7a5e872213f21dc64aeae86491d603b6

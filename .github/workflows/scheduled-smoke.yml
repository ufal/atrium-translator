# .github/workflows/scheduled-smoke.yml
# Nightly re-run of the full suite in a FROM-SCRATCH environment.
#
# What this job is for, stated because it is easy to misread (issue atrium-project#10):
# it runs the same hermetic suite the PR lane runs, so it adds no new test coverage. Its
# signal is DEPENDENCY DRIFT -- the PR lane runs against a warm cache and a resolved
# environment, while this installs requirements-test.txt, requirements.txt and
# service/requirements.txt fresh every night. A transitive release that breaks the
# install, or a floating pin that moves under us, shows up here and nowhere else.
#
# It is deliberately NOT `-m slow`, and that decision is re-confirmed here rather
# than inherited (roadmap D1, atrium-project#64). The original reason -- "this repo
# has no slow-marked tests" -- stopped being true when issue #58 added the subprocess
# import probe at tests/test_service_entrypoint.py:108. The decision stands on the
# other half of the argument, which has not changed: nlp-enrich and llm-enrich both
# ran nightlies of `pytest -m slow` that collected nothing and reported success for
# as long as they existed. Narrowing this lane to the one slow test would trade a
# whole-suite dependency-drift signal for a single subprocess check. Running the real
# suite is the point.
#
# What it does NOT cover: a live LINDAT backend. Every /translate test mocks the
# pipeline, which is how service/api.py shipped omitting `backend` from its args and
# returned HTTP 500 on every real upload. That gap needs an integration lane with a
# reachable backend, not a marker.

name: Scheduled Smoke Test

# Mirrors the hub's e2e-pipeline-smoke.yml: a smoke run that is already executing is
# the one carrying the signal, so a later trigger queues rather than killing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write          # required by "Open Issue on Failure"; GitHub's 403 asked
                         # for exactly this (x-accepted-github-permissions: issues=write).
                         # A permissions block WITHOUT it pins issues=none -> 403.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:     # allow manual re-runs

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # (12-factor X) Must match what ships. Every image in the ecosystem is
          # python:3.11-slim and every other CI lane -- including the PR lane inside
          # the hub's docker-tool.reusable.yml -- is 3.11. This job was the single
          # 3.12 lane in the ecosystem, and it is also the widest: a 3.12-only
          # failure reads as a product bug, and a 3.12-only pass hides one.
          # (atrium-project#64)
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-test.txt
          pip install -r requirements.txt
          pip install -r service/requirements.txt

      - name: Run Pytest
        # `-rs` prints every skip with its reason, so a dependency that quietly stops
        # installing shows up as a growing skip list rather than as a still-green run.
        run: pytest tests/ -rs

      # One open issue per failing lane, commented on by each later failure; scheduled runs only
      # (atrium-project#81). It used to open a new issue on every failing run.
      - name: Open or update the lane's issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: ufal/atrium-project/.github/actions/lane-failure-issue@439488bb285d48eec099195528f9d1772f3b1119  # v1
        with:
          lane: scheduled-smoke
          title: Scheduled smoke test failed
          labels: bug,automated issue
          body: >-
            The automated daily smoke test failed. Please review the action logs.

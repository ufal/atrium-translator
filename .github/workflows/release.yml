name: Release Bundle

# The release certifies its images (atrium-project#81, decided 2026-10-22): the `image` job builds,
# probes, scans and promotes them through the hub's docker-tool.reusable.yml with
# `release-gate: true`, and the release job needs it. A failed test, build, container probe or
# fixable-CRITICAL gate therefore means no release; the release attaches `images.json` (the digest
# each promoted tag resolves to) and its notes open with the digests. docker.yml no longer runs on
# a tag, so one tag run does both (hub docs/ci_policy.md, Releases). A dispatched dry run builds
# and probes the images without pushing them; with `simulate-probe-failure` the probe fails on
# purpose and nothing may be pushed or released.

# Never cancel a release. The trigger is a tag push, so each run has its own ref and
# overlap is only possible on a re-run of the same tag — where cancelling the first
# could leave a half-published release behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*.*.*'
  # The dry run (atrium-project#32 round 2, #40: an immutable release uses up its tag, so
  # the gate is proven BEFORE tagging): the bundle is built and verified and the OpenAPI
  # checks run against the dispatched ref and the latest release; nothing is published.
  workflow_dispatch:
    inputs:
      simulate-probe-failure:
        description: "Make the container probe fail on purpose (atrium-project#81): nothing may be published."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ── Release gate ────────────────────────────────────────────────────────────
  # A mistagged push (tag != CITATION.cff != para_config.txt [tool] version)
  # fails HERE and blocks the create-release job below, so nothing gets
  # published. Same check as ufal/atrium-project security.reusable.yml's
  # version-check — both now run the SAME vendored check_version.py, so the two
  # cannot drift apart the way the old inline copies did. It stays a VENDORED FILE
  # rather than a `uses:` on purpose: the guard must not depend on a cross-repo
  # `uses: …@v1` resolving at tag-push time.
  version-guard:
    name: Verify tag == CITATION.cff == para_config.txt
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Block release on version/tag mismatch
        # Was a ~45-line inline python heredoc, duplicated verbatim across all
        # five release.yml files and again (in a drifted variant) in the hub's
        # security.reusable.yml. Now one vendored script, held byte-identical to
        # docs/templates/shared/check_version.py by para-drift.reusable.yml (#18).
        # Kept as a vendored file, not a reusable workflow: this gate must not
        # depend on a cross-repo `uses:` resolving at tag-push time.
        env:
          TAG_REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # A dry run (workflow_dispatch on a branch) has no tag to compare; it still checks
          # that CITATION.cff and para_config.txt agree.
          if [ "$REF_TYPE" = "tag" ]; then
            python check_version.py \
              --citation CITATION.cff \
              --para-config para_config.txt \
              --tag "$TAG_REF" \
              --require-tag
          else
            python check_version.py --citation CITATION.cff --para-config para_config.txt
          fi

  # ── The images this release certifies (atrium-project#81) ──────────────────────────────────
  # The one cross-repo `uses:` of this file, by decision: only the hub's reusable builds, probes,
  # scans and promotes the image a release certifies (hub docs/release_trust.md). The inputs are
  # docker.yml's. With release-gate a failed probe leg pushes nothing for any target, and the
  # `create-release` job below never runs.
  image:
    needs: version-guard
    permissions:
      # docker-tool.reusable.yml's build-and-push uploads the post-publish Trivy SARIF and pushes
      # to GHCR; a reusable's permissions are capped by this block (see docker.yml).
      contents: read
      packages: write
      security-events: write
    uses: ufal/atrium-project/.github/workflows/docker-tool.reusable.yml@18f06680dfb60142eeece2f46189f9a2fa79230a  # v1
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      image-name: ${{ github.repository }}
      # issue #55: `api` is a new Dockerfile stage. Before it existed this repo's
      # FastAPI service was reachable only via a docker-compose entrypoint override on
      # the batch image, so no runnable API image was published and there was nothing
      # for ARÚP/ARÚB to deploy. Only `api` is probed — `base` is a batch CLI.
      build-targets: '["base", "api"]'
      probe-targets: '["api"]'
      # atrium-project#72: `api` is this stage's production image, the one AMČR pins; its
      # first-party files are declared in .github/production-image.json and checked by
      # workflow-lint. `base` is the batch CLI (main.py): published, never pinned. The probe
      # also fails an image with PyMuPDF installed (the reusable's forbidden-distributions).
      release-gate: true
      simulate-probe-failure: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate-probe-failure }}

  create-release:
    needs: [version-guard, image]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Build deployment package
        # This list was hand-maintained and had fallen behind the code: it omitted
        # atrium_document.py (imported at main.py:31 and by utils.py),
        # atrium_document.schema.json (loaded at atrium_document.py:1005),
        # service/atrium_service.py (imported at service/api.py:29) and
        # service/healthcheck.py -- so the published zip, which is the primary
        # download path for anyone not using the container, raised
        # ModuleNotFoundError on first run. A release artifact that cannot start is
        # the build/release/run separation failing in the direction that matters
        # (atrium-project#53 factor V).
        #
        # tests/test_release_bundle.py recomputes the import closure of the two
        # entry points and fails if this list falls behind again, so the next
        # canonical file to land is a red test rather than a broken download.
        run: |
          set -euo pipefail
          mkdir -p dist/service

          # Entry points and their package.
          cp -r main.py utils.py load_vocab.py processors/ dist/

          # Vendored canonical modules the entry points import, plus the schema
          # atrium_document.py resolves next to itself at runtime.
          cp atrium_document.py atrium_document.schema.json dist/
          cp atrium_paradata.py para_licenses.py dist/
          # atrium_limits.py + tool_limits.py: every limit this tool has, declared once
          # (atrium-project#53) -- main.py, utils.py, processors/ and the service import them.
          cp atrium_limits.py tool_limits.py dist/
          # atrium_openapi.py: service/atrium_service.py imports it (lazily) to finish and
          # digest the OpenAPI document -- /openapi.json and /info `openapi_sha256` need it
          # (atrium-project#32 round 2).
          cp atrium_openapi.py dist/
          # atrium_rocrate.py (+ atrium_vocab.py, which it imports): service/api.py builds the
          # call's CreateAction, returned as the response's `paradata` (atrium-project#71).
          cp atrium_rocrate.py atrium_vocab.py dist/

          # The HTTP surface. atrium_service.py and healthcheck.py are canonical
          # files held byte-identical by para-drift; the service does not start
          # without the first and the container cannot probe itself without the second.
          cp service/api.py service/atrium_service.py service/healthcheck.py service/requirements.txt dist/service/
          # The committed OpenAPI document, unstamped; the stamped one is the release's own
          # `openapi.json` asset (below).
          cp service/openapi.json dist/service/

          # Install manifest and the run configuration main.py reads by default
          # (--config defaults to config.txt; config.txt's `fields` points at
          # amcr-fields.txt; atrium_paradata.py looks for para_config.txt).
          cp requirements.txt config.txt para_config.txt amcr-fields.txt dist/

          cd dist
          zip -r ../atrium-translator-release.zip .

      - name: Verify the bundle actually runs
        # Acceptance for the above, performed rather than asserted: unpack the
        # published artifact into a clean directory, install it, and import both
        # entry points. Importing is enough -- it resolves every import in the
        # closure -- and unlike `python -m service.api` it does not start a server
        # and hang the job, since that module's __main__ block runs uvicorn
        # directly and takes no --help.
        run: |
          set -euo pipefail
          rm -rf /tmp/bundle-check && mkdir -p /tmp/bundle-check
          unzip -q atrium-translator-release.zip -d /tmp/bundle-check
          cd /tmp/bundle-check
          python -m pip install --quiet -r requirements.txt -r service/requirements.txt
          python -c "import main; print('batch entry point OK')"
          python -c "import service.api; print('API entry point OK')"

      # ── The OpenAPI document (atrium-project#32 item 3) ─────────────────────────
      # Each release also carries `openapi.json` (service/openapi.json, stamped with the
      # release version) and `openapi.json.sha256`: the spec the AMČR pipeline generates its
      # clients from, and the digest a running image reports as /info `openapi_sha256`.
      # Everything below runs the VENDORED atrium_openapi.py (stdlib only, held byte-identical
      # to the hub by para-drift): like check_version.py above, a release gate must not depend
      # on a cross-repo `uses:` resolving at tag-push time (hub docs/docker_gha_roadmap.md §3.3).
      # These steps stay outside "Build deployment package", whose cp lines
      # tests/test_release_bundle.py reads.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check the committed spec is what this commit generates
        # The asset below IS service/openapi.json, so it must be current. This workflow cannot
        # see this commit's api-contract or Docker smoke runs, so it checks for itself, with the
        # pinned light test lane (fastapi and pydantic exactly as the image has them). An
        # import error fails here: a release gate does not skip.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          python atrium_openapi.py check --app service.api:app --spec service/openapi.json

      - name: Install oasdiff
        # Pinned to the version atrium_openapi.py's rules were measured against. `go install`
        # verifies the module against sum.golang.org; GOTOOLCHAIN=auto fetches the Go version
        # oasdiff's go.mod asks for.
        env:
          OASDIFF_VERSION: v1.32.1
        run: |
          GOTOOLCHAIN=auto go install "github.com/oasdiff/oasdiff@${OASDIFF_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Stamp the spec and compare it with the previous release
        # stamp: openapi-dist/openapi.json (info.version = the release version) + its .sha256
        # (not dist/, which is the bundle's staging directory). baseline: the highest release
        # below this tag that carries openapi.json (none → the bootstrap, which passes; an API
        # error fails). compare: a removed reason code always fails; any other breaking change
        # fails unless the major version went up.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_REF: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python atrium_openapi.py stamp --spec service/openapi.json --para-config para_config.txt --out-dir openapi-dist
          printf '%s' "$GH_TOKEN" | python atrium_openapi.py baseline --repo "$GITHUB_REPOSITORY" \
            ${TAG_REF:+--tag "$TAG_REF"} --out "$RUNNER_TEMP/previous.openapi.json" --token-stdin
          python atrium_openapi.py compare --base "$RUNNER_TEMP/previous.openapi.json" --rev openapi-dist/openapi.json \
            --para-config para_config.txt --require-oasdiff --summary "$GITHUB_STEP_SUMMARY"

      - name: Write images.json (atrium-project#81)
        # The digests the image job promoted; on a tag the release is only reached when it passed,
        # so an empty output there is a failure, not a release without its images.
        if: github.ref_type == 'tag'
        env:
          IMAGES_JSON: ${{ needs.image.outputs.images-json }}
        run: |
          set -euo pipefail
          if [ -z "$IMAGES_JSON" ]; then
            echo "::error::the image job reported no promoted images; the release would not certify them"
            exit 1
          fi
          mkdir -p images-dist
          printf '%s\n' "$IMAGES_JSON" | python -m json.tool > images-dist/images.json
          ( cd images-dist && sha256sum images.json > images.json.sha256 )
          printf '%s\n\n' "**Images this release certifies** (\`images.json\`, atrium-project#81):" > "$RUNNER_TEMP/notes.md"
          python - <<'PY' >> "$RUNNER_TEMP/notes.md"
          import json
          record = json.load(open("images-dist/images.json", encoding="utf-8"))
          for entry in record["images"]:
              print(f"- `{entry['image']}:{entry['tag']}` = `{entry['digest']}`")
          PY
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        # SHA-pinned: this action holds `contents: write`. A moving tag can be
        # force-pushed to malicious code -- exactly what happened to
        # aquasecurity/trivy-action in 2026-03 (GHSA-69fq-xp46-6x23). Dependabot
        # keeps the SHA and the trailing version comment in step (#18).
        #
        # The spec is attached in this same step, when the release is created: an immutable
        # release (atrium-project#40) refuses assets added after it is published.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          # The certified images first, then the generated notes (atrium-project#81).
          body_path: ${{ runner.temp }}/notes.md
          files: |
            atrium-translator-release.zip
            openapi-dist/openapi.json
            openapi-dist/openapi.json.sha256
            images-dist/images.json
            images-dist/images.json.sha256
          generate_release_notes: true

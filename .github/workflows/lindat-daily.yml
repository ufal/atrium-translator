# .github/workflows/lindat-daily.yml
# The daily check of the live LINDAT translation service (atrium-project#78).
#
# Every other lane mocks LINDAT. This one sends it the same short Czech sentence 24 times (12 on a fresh
# connection each, 12 over one keep-alive session) with eval/lindat_probe.py and fails when a reply is bad:
# an HTTP error or timeout, a reply the pipeline's guard rejects (a decoder loop, runaway length), or one that
# is not a translation (a number lost, the source repeated, Czech letters kept). Repeating the request is the
# point: in October one broken replica behind LINDAT's balancer answered every other request with garbage,
# which a single request finds half the time.
#
# A failing scheduled run opens the lane's issue, or comments on it while it is open (the hub's
# lane-failure-issue action, atrium-project#81). The probe's own summary, with the pattern per mode and a
# sample bad reply, is in the run's summary page.
#
# It installs only `requests`: the probe needs nothing else, and the lane stays a minute long.

name: LINDAT daily check

# Its own group, so it never queues behind or cancels the scheduled smoke test.
concurrency:
  group: lindat-daily-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write          # the lane's issue on a scheduled failure

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

jobs:
  lindat:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install the probe's one dependency
        # The version requirements.txt pins, so the probe talks to LINDAT as the pipeline does.
        run: python -m pip install "$(grep -E '^requests==' requirements.txt)"

      - name: Probe LINDAT (24 requests)
        shell: bash
        run: |
          python -m eval.lindat_probe --text daily --n 12 --pause 0.5 --max-bad 0 | tee probe.txt
          rc=${PIPESTATUS[0]}
          {
            echo '### LINDAT daily check'
            echo
            echo '```'
            sed -n '/── summary/,$p' probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Open or update the lane's issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: ufal/atrium-project/.github/actions/lane-failure-issue@v1
        with:
          lane: lindat-daily
          title: LINDAT daily check failed
          labels: ci,upstream
          body: >-
            The daily check of the LINDAT translation service found bad replies. The run's summary shows the
            pattern per mode and a sample reply; one broken replica behind the balancer shows as an alternating
            pattern. If it persists, report it to LINDAT with that summary.

# Base Ruff configuration for ATRIUM tools
#
# Aligned with atrium-project docs/templates/ruff.toml: `target-version` (now
# declared there too) and the "B" (flake8-bugbear) rules below match
# alto-postprocess, nlp-enrich and llm-enrich.
#
# target-version pins the syntax Ruff lints against to the version this repo
# actually ships -- every image is python:3.11-slim. It had been unset, so the
# Python version lived only in the Dockerfile FROM line and in each workflow's
# `python-version:` input, which is precisely how scheduled-smoke.yml came to run
# a 3.12 lane against a 3.11 image without anything noticing (atrium-project#64).
line-length = 120

target-version = "py311"

# Apply exclude/extend-exclude even to EXPLICIT command-line paths. Without this the
# [format] exclude below is inert exactly where it must work: pre-commit runs
# `ruff-format <changed files>`, and ruff otherwise honours exclusions only while
# walking directories -- so a vendored canonical file still gets re-wrapped on commit.
# (issue atrium-project#10)
force-exclude = true

extend-exclude = [
    "data_samples/",
    "result/",
    "supplementary/",
    "tests/fixtures/",
    "service/frontend*/"
]

[lint]
# "B" (flake8-bugbear) is the one part of alto-postprocess's superset NOT adopted
# here, and the reason is recorded rather than left as an omission. Enabling it
# reports 15 findings, and the two clusters that dominate are both wrong for this
# codebase:
#
#   * B905 (`zip()` without strict=) x5, all in utils.py's ALTO dual-pass
#     reconstruction. A line-count mismatch between the block pass and the line
#     pass is not an error there -- it is the documented condition that triggers
#     the 1-by-1 re-translation fallback. `strict=True` would turn a handled case
#     into an exception on real scanned input; `strict=False` is pure noise.
#   * B023 (loop variable not bound) x2 at processors/translator.py:395,404. The
#     lambdas are consumed by re.sub() inside the same iteration, before the name
#     is rebound, so the late-binding B023 warns about cannot occur.
#
# The remainder (B904 exception chaining x4, B007, B017, B018) are worth doing,
# but as their own change with its own review -- not smuggled in under a
# version-pin commit. Recorded in agent_dev_logs so the list is not rediscovered.
#
# If "B" is adopted later it needs this, or every endpoint in service/api.py
# becomes a B008 error, FastAPI's markers being calls in argument defaults:
#
#   [lint.flake8-bugbear]
#   extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends"]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[format]
# DO NOT FORMAT THE VENDORED CANONICAL FILES.
#
# para-drift requires them byte-identical across the hub and all five tool repos, but
# `ruff format` reflows to the LOCAL `line-length` -- 120 in this repo, page-classification,
# alto-postprocess and translator; 100 in nlp-enrich and llm-enrich -- while the hub is
# deliberately never auto-formatted. So a shared file's bytes became a function of which
# repo committed it last: vendoring tests/test_document_originators.py on 2026-08-05 split
# it into two wrap-variants and turned Paradata Canonical Drift red in three repos.
# Each variant is a fixed point of its own config, so re-vendoring alone would not hold.
#
# Linting still applies -- this excludes formatting only. Full rationale in the hub
# template. If you add a file to the para-drift set, add it here too. (issue atrium-project#10)
exclude = [
    "atrium_document.py",
    "atrium_vocab.py",
    "atrium_paradata.py",
    "para_licenses.py",
    "check_version.py",
    "service/atrium_service.py",
    "service/healthcheck.py",
    "tests/test_para_licenses.py",
    "tests/test_document_originators.py",
    "tests/test_atrium_vocab.py",
    "atrium_rocrate.py",
    "tests/test_atrium_rocrate.py",
    "tests/test_dockerfile_security_layer.py",
    "tests/test_logging_contract.py",
    "tests/test_env_contract.py",
    "tests/test_schema_freeze.py",
]
